[workspace]
resolver = "3"
members = [
    "crates/winwright-contracts",
    "crates/winwright-core",
    "crates/winwright-security",
    "crates/winwright-win32",
    "crates/winwright-uia",
    "crates/winwright-input",
    "crates/winwright-overlay",
    "crates/winwright-capture",
    "crates/winwright-shell",
    "crates/winwright-memory",
    "crates/winwright-files",
    "crates/winwright-mcp",
    "crates/winwright-inspector",
    "crates/winwright-cli",
    "crates/winwright-test-support",
    "fixtures/test-win32-app",
    "fixtures/test-custom-canvas",
]
default-members = [
    "crates/winwright-contracts",
    "crates/winwright-core",
    "crates/winwright-security",
    "crates/winwright-win32",
    "crates/winwright-uia",
    "crates/winwright-input",
    "crates/winwright-overlay",
    "crates/winwright-capture",
    "crates/winwright-shell",
    "crates/winwright-memory",
    "crates/winwright-files",
    "crates/winwright-mcp",
    "crates/winwright-inspector",
    "crates/winwright-cli",
]

[workspace.package]
version = "0.3.4"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Nexace/winwright"
publish = false

[workspace.dependencies]
winwright-capture = { path = "crates/winwright-capture" }
winwright-contracts = { path = "crates/winwright-contracts" }
winwright-core = { path = "crates/winwright-core" }
winwright-input = { path = "crates/winwright-input" }
winwright-inspector = { path = "crates/winwright-inspector" }
winwright-overlay = { path = "crates/winwright-overlay" }
winwright-files = { path = "crates/winwright-files" }
winwright-mcp = { path = "crates/winwright-mcp" }
winwright-memory = { path = "crates/winwright-memory" }
winwright-security = { path = "crates/winwright-security" }
winwright-shell = { path = "crates/winwright-shell" }
winwright-uia = { path = "crates/winwright-uia" }
winwright-win32 = { path = "crates/winwright-win32" }
winwright-test-support = { path = "crates/winwright-test-support" }

base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
regex = "1.13"
# stdio MCP only: no HTTP/auth stacks (keeps the dependency tree small).
rmcp = { version = "3.5", features = ["transport-io"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
windows = "0.62"
windows-core = "0.62"

# Keep the build folder small: line tables are enough for backtraces in our crates, and
# dependency debug info (windows-rs especially) is by far the largest part of target/.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
# Small and quick enough: Winwright mostly waits on Windows UI Automation, so size beats raw
# speed. Not panic = "abort": the native window procedures rely on catch_unwind.
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
